<script>
const USER_PINS = {
  'Jeremy Levin': '1245',
  'Sean Forester': '3867',
  'Dominique Black': '2195',
  'Alexander Duff': '0132',
  'Justin Messenger': '5132'
};
const SUPABASE_URL = 'https://qxqrwusaynfqadjfqswe.supabase.co';
const SUPABASE_KEY = 'sb_publishable_2ba9yzEA89uqXHJ6v-_cQg_AmwwEfFF';
const HOTEL_NAMES = {'PBH':'Loews Portofino Bay Hotel','HRH':'Hard Rock Hotel','RPR':'Loews Royal Pacific Resort','SFR':'Loews Sapphire Falls Resort','AVA':'Universal Aventura Hotel','CBBR':'Universal Cabana Bay Beach Resort','ESS':"Universal's Endless Summer Resort - Surfside",'ESD':"Universal's Endless Summer Resort - Dockside",'SNR':'Universal Stella Nova Resort','TLR':'Universal Terra Luna Resort','HGH':'Universal Helios Grand Hotel','LKWD':'Lakewood Regional Office'};
const VEH_TYPES = ['Golf Cart','SUV','Truck','Van','Bicycle','Other'];
const VEH_STATUSES = ['In Service','Out of Service','In the Shop','Inspected'];
let vehicles = [], propFilter = '', statusFilter = '', searchTerm = '', editingUid = null;
var PROP_ORDER = ['PBH','HRH','RPR','CBBR','SFR','AVA','ESS','ESD','SNR','TLR','HGH','LKWD'];
var vehTs = 0;
let expandedProps = new Set();

async function loadVehicles() {
  const statusEl = document.getElementById('status');
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/app_records?id=eq.vehicle-state&select=data`, {headers:{'apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`}});
    const json = await res.json();
    const data = json[0]?.data || {};
    const cloudVehs = Array.isArray(data.vehicles) ? data.vehicles : [];
    const cloudTs = data._ts || 0;
    let localVehs = []; try { localVehs = JSON.parse(localStorage.getItem('vehicle_cache')||'[]'); } catch(e) {}
    const localTs = parseInt(localStorage.getItem('vehicle_cache_ts')||'0') || 0;
    if(cloudVehs.length === 0 && localVehs.length){ vehicles = localVehs; vehTs = localTs; }
    else if(localVehs.length > cloudVehs.length + 5 && localTs > cloudTs){ vehicles = localVehs; vehTs = localTs; }
    else { vehicles = cloudVehs; vehTs = cloudTs; }
    try { localStorage.setItem('vehicle_cache', JSON.stringify(vehicles)); localStorage.setItem('vehicle_cache_ts', String(vehTs)); } catch(e) {}
    statusEl.textContent = `Online — ${vehicles.length} vehicles`; statusEl.className = 'status online';
  } catch(err) {
    try { vehicles = JSON.parse(localStorage.getItem('vehicle_cache')||'[]');
      statusEl.textContent = `Offline — ${vehicles.length} cached`; statusEl.className = 'status offline';
    } catch(e) { document.getElementById('content').innerHTML = '<div style="padding:20px;color:red;">Failed to load</div>'; return; }
  }
  const props = PROP_ORDER.concat([...new Set(vehicles.map(v=>v.prop))].filter(h=>!PROP_ORDER.includes(h)).sort());
  document.getElementById('propFilter').innerHTML = '<option value="">All Properties</option>' + props.map(h=>`<option value="${h}">${h}</option>`).join('');
  render();
}
function toggleProp(h) { const el=document.getElementById('prop-'+h); if(el){ el.classList.toggle('expanded'); if(el.classList.contains('expanded')) expandedProps.add(h); else expandedProps.delete(h); } }
function statusClass(s){ return {'In Service':'st-inservice','Out of Service':'st-out','In the Shop':'st-shop','Inspected':'st-inspected'}[s]||'st-inspected'; }
function statusColor(s){ return {'In Service':'#2f855a','Out of Service':'#e53e3e','In the Shop':'#dd6b20','Inspected':'#526d82'}[s]||'#526d82'; }
function fmtMiles(m){ if(m===''||m==null||isNaN(Number(m))) return '—'; return Number(m).toLocaleString('en-US'); }
function fmtDate(d){ if(!d) return '—'; const dt=new Date(d+'T12:00:00'); if(isNaN(dt)) return escapeHtml(String(d)); return dt.toLocaleDateString('en-US',{month:'numeric',day:'numeric',year:'numeric'}); }
function fmtDT(ts){ if(!ts) return '—'; var d=new Date(ts); if(isNaN(d)) return '—'; return d.toLocaleDateString('en-US',{month:'numeric',day:'numeric',year:'numeric'})+', '+d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}); }
function lastFuel(v){ var f=(v&&v.fuel)||[]; if(!f.length) return null; return f[f.length-1]; }
function fuelSectionHtml(veh){
  var f=(veh.fuel||[]).slice().reverse();
  var rows = f.length ? f.slice(0,5).map(function(x){ return '<div style="padding:5px 2px;border-bottom:1px solid #edf2f7;font-size:13.5px;">⛽ <b>'+x.gal+' gal</b>'+(x.cost?' · $'+Number(x.cost).toFixed(2):'')+' — '+fmtDT(x.ts)+(x.by?' · '+escapeHtml(x.by):'')+'</div>'; }).join('') : '<div style="color:#718096;font-size:13.5px;">No fill-ups logged yet.</div>';
  var tot = f.reduce(function(s,x){ return s+(Number(x.gal)||0); },0);
  return '<p><span class="label">⛽ Fuel Log</span><br>'
    + rows
    + (f.length?'<div style="font-size:12.5px;color:#4a5568;padding-top:4px;">Total logged: '+tot.toFixed(1)+' gal · '+f.length+' fill-up'+(f.length>1?'s':'')+'</div>':'')
    + '<span style="display:flex;gap:6px;margin-top:8px;"><input id="fGal" type="number" step="0.1" min="0" placeholder="Gallons" style="flex:1;padding:9px;border:1px solid #ccc;border-radius:4px;"><input id="fCost" type="number" step="0.01" min="0" placeholder="Cost $ (optional)" style="flex:1;padding:9px;border:1px solid #ccc;border-radius:4px;"></span>'
    + '<button type="button" onclick="logFuel()" style="width:100%;margin-top:8px;padding:11px;background:#b7791f;color:white;border:none;border-radius:6px;font-size:15px;font-weight:700;cursor:pointer;">⛽ Log Fill-Up — stamps the date &amp; time</button></p>';
}
async function logFuel(){
  var veh=vehicles.find(v=>v.uid===editingUid); if(!veh) return;
  var galEl=document.getElementById('fGal'); var gal=galEl?parseFloat(galEl.value):NaN;
  if(!(gal>0)){ alert('Type how many gallons went in first.'); return; }
  var costEl=document.getElementById('fCost'); var costRaw=costEl?costEl.value:''; var cost=costRaw===''? '' : parseFloat(costRaw);
  if(!Array.isArray(veh.fuel)) veh.fuel=[];
  var by=''; try{ by=sessionStorage.getItem('vehUser')||localStorage.getItem('loewsUser')||''; }catch(e){}
  veh.fuel.push({gal:gal, cost:(cost===''||isNaN(cost))?'':cost, by:by, ts:Date.now()});
  try{ await pushVehicles(); try{localStorage.setItem('vehicle_cache',JSON.stringify(vehicles));}catch(e){}
    openEdit(veh.uid); var m=document.getElementById('saveMsg'); if(m){ m.textContent='Fill-up logged ✓ '+fmtDT(Date.now()); m.style.color='green'; }
  }catch(err){ alert('Fuel log failed: '+err.message); veh.fuel.pop(); }
}
function renderStats(){
  const counts = {}; VEH_STATUSES.forEach(s=>counts[s]=0);
  vehicles.forEach(v=>{ const s=v.status||'In Service'; counts[s]=(counts[s]||0)+1; });
  let h = '<span class="stat-pill" style="background:#1a365d;">Total: '+vehicles.length+'</span>';
  VEH_STATUSES.forEach(s=>{ h += '<span class="stat-pill" style="background:'+statusColor(s)+';">'+s+': '+counts[s]+'</span>'; });
  document.getElementById('statsBar').innerHTML = h;
}
function render() {
  renderStats();
  let filtered = vehicles;
  if (propFilter) filtered = filtered.filter(v=>v.prop===propFilter);
  if (statusFilter) filtered = filtered.filter(v=>v.status===statusFilter);
  if (searchTerm) { const t=searchTerm.toLowerCase(); filtered=filtered.filter(v=>(v.id||'').toLowerCase().includes(t)||(v.type||'').toLowerCase().includes(t)||(v.assignedTo||'').toLowerCase().includes(t)||(v.notes||'').toLowerCase().includes(t)); }
  const byProp = {}; filtered.forEach(v=>{ const h=v.prop||'?'; (byProp[h]=byProp[h]||[]).push(v); });
  const unfiltered = !propFilter && !statusFilter && !searchTerm;
  let orderedKeys = PROP_ORDER.filter(h=> unfiltered || byProp[h]);
  Object.keys(byProp).sort().forEach(h=>{ if(!orderedKeys.includes(h)) orderedKeys.push(h); });
  if(unfiltered) PROP_ORDER.forEach(h=>{ if(!byProp[h]) byProp[h]=[]; });
  let html = '<div style="display:grid;grid-template-columns:1fr 1fr;gap:0 8px;padding:0 8px;">';
  orderedKeys.forEach(h=>{
    const list = byProp[h].sort((a,b)=>(a.id||'').localeCompare(b.id||'', undefined, {numeric:true}));
    html += `<div class="hotel-section${expandedProps.has(h)?' expanded':''}" id="prop-${h}"><div class="hotel-header" onclick="toggleProp('${h}')"><span>${h}</span><span class="hotel-count">${list.length}</span></div><div class="hotel-body"><div class="veh-grid">`;
    list.forEach(v=>{ html+=`<span class="veh-chip ${statusClass(v.status)}" onclick="event.stopPropagation();openEdit('${v.uid}')" title="Click to edit — ${escapeHtml(v.status||'In Service')}${v.assignedTo?' · '+escapeHtml(v.assignedTo):''}">${escapeHtml(v.id||'?')}${(v.notes&&String(v.notes).trim())?' 📝':''}</span>`; });
    html += '</div></div></div>';
  });
  document.getElementById('content').innerHTML = html+'</div>';
}
function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

/* ---------- Photo shrink (same pattern as Camera app) ---------- */
function shrinkPhoto(file, cb){
  function fallback(){
    var url, img=new Image();
    try{ url=URL.createObjectURL(file); }catch(e){ rawRead(); return; }
    img.onload=function(){
      try{
        var max=1024, w=img.naturalWidth||0, h=img.naturalHeight||0;
        if(!w||!h){ URL.revokeObjectURL(url); rawRead(); return; }
        var scale=Math.min(1, max/Math.max(w,h));
        var cv=document.createElement('canvas');
        cv.width=Math.round(w*scale); cv.height=Math.round(h*scale);
        cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
        URL.revokeObjectURL(url);
        cb(cv.toDataURL('image/jpeg',0.68));
      }catch(e){ try{URL.revokeObjectURL(url);}catch(err){} rawRead(); }
    };
    img.onerror=function(){ try{URL.revokeObjectURL(url);}catch(e){} rawRead(); };
    img.src=url;
  }
  function rawRead(){ var r=new FileReader(); r.onload=function(ev){ cb(ev.target.result); }; r.readAsDataURL(file); }
  try{
    if(window.createImageBitmap){
      createImageBitmap(file,{resizeWidth:1024,resizeQuality:'medium'}).then(function(bmp){
        try{
          var cv=document.createElement('canvas'); cv.width=bmp.width; cv.height=bmp.height;
          cv.getContext('2d').drawImage(bmp,0,0);
          cb(cv.toDataURL('image/jpeg',0.68));
        }catch(e){ fallback(); }
      }, function(){ fallback(); });
    } else fallback();
  }catch(e){ fallback(); }
}
function handlePhotoSelect(input, uid){
  const file = input.files[0];
  if(!file) return;
  shrinkPhoto(file, function(dataUrl){
    const veh = vehicles.find(v=>v.uid===uid);
    if(veh){
      if(!veh.photos) veh.photos = [];
      veh.photos.push({name:file.name, type:(dataUrl.match(/^data:([^;]+)/)||[])[1]||file.type, size:file.size, data:dataUrl, uploadedAt:new Date().toISOString(), uploadedBy:(function(){try{return sessionStorage.getItem('vehUser')||'unknown';}catch(e){return 'unknown';}})()});
      saveToCloud();
      refreshPhotoList(uid);
    }
  });
}
function refreshPhotoList(uid){
  const veh = vehicles.find(v=>v.uid===uid);

/* ---------- Cloud sync (guarded push — same pattern as Camera app) ---------- */
async function pushVehicles(){
  const r = await fetch(`${SUPABASE_URL}/rest/v1/app_records?id=eq.vehicle-state&select=data`,{headers:{'apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`}});
  const cur = (await r.json())[0]?.data || {};
  const cloudVehs = Array.isArray(cur.vehicles) ? cur.vehicles : [];
  if(cloudVehs.length > vehicles.length + 5){
    const have = new Set(vehicles.map(v=>v.uid));
    const missing = cloudVehs.filter(v=>v && v.uid && !have.has(v.uid));
    if(missing.length) vehicles = vehicles.concat(missing);
  }
  vehTs = Date.now();
  const res = await fetch(`${SUPABASE_URL}/rest/v1/app_records?id=eq.vehicle-state`,{method:'PATCH',headers:{'apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`,'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify({data:{...cur,vehicles,_ts:vehTs}})});
  if(res && !res.ok) throw new Error(res.status);
  try{ localStorage.setItem('vehicle_cache',JSON.stringify(vehicles)); localStorage.setItem('vehicle_cache_ts',String(vehTs)); }catch(e){}
  return res;
}
async function saveToCloud(){
  try{ await pushVehicles(); }
  catch(err){ try{localStorage.setItem('vehicle_cache',JSON.stringify(vehicles));}catch(e){} }
}

async function deleteVehicle(uid){

  vehicles = vehicles.filter(v=>v.uid!==uid);
  try{ await pushVehicles(); }catch(e){}
  closeModal(); render();
}
